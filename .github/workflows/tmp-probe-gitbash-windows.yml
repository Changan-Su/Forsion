name: tmp-probe-gitbash-windows

# 临时探针(11-08,CI 提速 PR 用完即删,不进 main):fetch-git addBash 在 Windows 上卡死,先看清是哪一步。
on:
  pull_request:
    paths:
      - '.github/workflows/tmp-probe-gitbash-windows.yml'
      - 'desktop/build/fetch-git.cjs'

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4
        with:
          node-version: 24.22.1

      - name: Which tar / bzip2 (pwsh, as the Package installer step sees them)
        shell: pwsh
        continue-on-error: true
        run: |
          where.exe tar
          where.exe bzip2
          tar --version
          & "$env:SystemRoot\System32\tar.exe" --version
          node -e "console.log(process.env.PATH.split(';').join('\n'))"

      # 修复后:真跑一遍 beforeBuild 里的 fetch-git(下载 → 解 MinGit → addBash → git / bash 冒烟),必需模式,失败即红。
      - name: fetch-git end to end (required mode)
        working-directory: desktop
        env:
          TANGU_REQUIRE_GIT: '1'
        run: |
          $t = Get-Date
          node build/fetch-git.cjs win32 x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "fetch-git total: {0:N1}s" -f ((Get-Date) - $t).TotalSeconds
