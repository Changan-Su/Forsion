name: probe-windows-clip-native
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/probe-windows-clip-native.yml'
      - 'desktop/scripts/clip-native-windows.e2e.cjs'
      - 'desktop/scripts/lib/windows-clip-desktop.ps1'
      - 'desktop/electron/clipExtension*'
      - 'desktop/frontend/src/components/BrowserExtensionPanel*'
      - 'desktop/package*.json'
permissions:
  contents: read
jobs:
  native-clip:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the real application and install Chrome for Testing
        run: |
          npm ci --prefix tangu-agent --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix desktop --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build --prefix tangu-agent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build --prefix desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node desktop/node_modules/playwright-core/cli.js install chromium
          exit $LASTEXITCODE
      - name: Verify open buttons, native Chrome / Edge folder drop, clipboard, Explorer and picker
        timeout-minutes: 8
        working-directory: desktop
        run: |
          New-Item -ItemType Directory -Force outputs/windows-clip-native | Out-Null
          node scripts/clip-native-windows.e2e.cjs 2>&1 | Tee-Object -FilePath outputs/windows-clip-native/run.log
          exit $LASTEXITCODE
      - name: Package the genuine Windows application directory
        working-directory: desktop
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run build:unitweb
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx electron-builder --config electron-builder.config.cjs --win --x64 --dir --publish never --config.directories.output=outputs/clip-package
          exit $LASTEXITCODE
      - name: Verify the packaged APPDATA copy and native installation
        timeout-minutes: 8
        working-directory: desktop
        run: |
          $env:FORSION_CLIP_NATIVE_EXE = Join-Path $PWD 'outputs/clip-package/win-unpacked/Forsion.exe'
          if (!(Test-Path -LiteralPath $env:FORSION_CLIP_NATIVE_EXE)) { throw 'Actual packaged executable is missing' }
          node scripts/clip-native-windows.e2e.cjs 2>&1 | Tee-Object -FilePath outputs/windows-clip-native/packaged-run.log
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-clip-native-evidence
          path: desktop/outputs/windows-clip-native/
