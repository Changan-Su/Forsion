apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// 「这台手机」本机引擎(mobile/android/local-engine/README.md):启动器(PRoot,GPL-2.0,独立程序)和基座(Ubuntu + Node)只进测试渠道的包。
//   -PlocalEngine 或 ANDROID_LOCAL_ENGINE=1 → 带上 src/localEngine/jniLibs(arm64)、解出原生库(PRoot 从 nativeLibraryDir 执行)、
//   启用前台服务,并把 local-engine/lock.json 钉住的基座作为不压缩的资产放进包里(assets/local-engine/base.tar.xz)。
//   基座文件:-PlocalEngineBase=<路径> 或 ANDROID_LOCAL_ENGINE_BASE,缺省 ~/.forsion-dev/local-engine/<lock 里的 file>;
//   找不到或 sha256 对不上 → 构建失败。引擎不进包:手机从 npm 取(lock.json 的 package,dist-tag android-<line>)。
//   CI 由 release-channel.mjs --test-channel 按 tag 决定(预发布 tag = 测试渠道)。不带时代码照样在包里,
//   页面看不到「这台手机」那一行(LocalEngine.configured() 要启动器和基座都在)。
//   -PlocalEngineTestKey=<64 位十六进制公钥>:只给 debug 包多认一把一次性测试钥匙(模拟器台架签篡改 / 过期的夹具),正式包永远只认引擎签名钥匙。
def localEngine = project.hasProperty('localEngine') || System.getenv('ANDROID_LOCAL_ENGINE') == '1'
def localEngineLock = new groovy.json.JsonSlurper().parse(file('../local-engine/lock.json'))
def localEngineTestKey = (project.findProperty('localEngineTestKey') ?: '').toString().trim()
if (!(localEngineTestKey ==~ /^([0-9a-f]{64})?$/)) throw new GradleException("localEngineTestKey must be 64 lowercase hex characters")
if (!(localEngineLock.package ==~ /^@[a-z0-9-]+\/[a-z0-9-]+$/) || !(localEngineLock.line instanceof Integer) || !(localEngineLock.minEngineVersion ==~ /^\d+\.\d+\.\d+$/)
        || !(localEngineLock.base.sha256 ==~ /^[0-9a-f]{64}$/) || !(localEngineLock.base.version ==~ /^[A-Za-z0-9._-]+$/)) {
    throw new GradleException("mobile/android/local-engine/lock.json is malformed")
}
def localEngineBaseDir = layout.buildDirectory.dir('generated/localEngineBase')
def localEngineBaseSrc = { ->
    def p = (project.findProperty('localEngineBase') ?: System.getenv('ANDROID_LOCAL_ENGINE_BASE') ?: '').toString().trim()
    p ? file(p) : new File(System.getProperty('user.home'), ".forsion-dev/local-engine/${localEngineLock.base.file}")
}

android {
    namespace "com.forsion.tangu"
    compileSdk rootProject.ext.compileSdkVersion
    buildFeatures { compose true; buildConfig true }
    kotlinOptions { jvmTarget = '21' }
    // 原生栏的布局 / 读屏语义单测(NativeChromeBarLayoutTest)让 Compose 跑在 JVM 上(Robolectric),要用到应用的资源与清单。
    testOptions { unitTests { includeAndroidResources = true } }
    defaultConfig {
        applicationId "com.forsion.tangu"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI(build-desktop.yml)按 run_number/tag 注入,本地缺省 1/"1.0"(同号覆盖安装没问题,只是别发外)。
        versionCode Integer.parseInt(System.getenv("ANDROID_VERSION_CODE") ?: "1")
        versionName (System.getenv("ANDROID_VERSION_NAME") ?: "1.0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [localEngineEnabled: localEngine ? 'true' : 'false']
        buildConfigField 'String', 'LOCAL_ENGINE_PACKAGE', "\"${localEngineLock.package}\""
        buildConfigField 'int', 'LOCAL_ENGINE_LINE', "${localEngineLock.line}"
        buildConfigField 'String', 'LOCAL_ENGINE_MIN_VERSION', "\"${localEngineLock.minEngineVersion}\""
        // the base fields are empty in normal builds: no base asset → "This phone" stays hidden
        buildConfigField 'String', 'LOCAL_ENGINE_BASE_VERSION', "\"${localEngine ? localEngineLock.base.version : ''}\""
        buildConfigField 'String', 'LOCAL_ENGINE_BASE_SHA256', "\"${localEngine ? localEngineLock.base.sha256 : ''}\""
        buildConfigField 'long', 'LOCAL_ENGINE_BASE_SIZE', "${localEngine ? localEngineLock.base.size : 0}L"
        buildConfigField 'long', 'LOCAL_ENGINE_BASE_UNPACKED', "${localEngine ? localEngineLock.base.unpackedSize : 0}L"
        buildConfigField 'String', 'LOCAL_ENGINE_TEST_KEY', '""'
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    if (localEngine) {
        sourceSets { main { jniLibs.srcDirs += ['src/localEngine/jniLibs']; assets.srcDirs += [localEngineBaseDir.get().asFile] } }
        // extractNativeLibs=true:PRoot 要从 nativeLibraryDir 当程序执行(从数据目录执行会被 SELinux 拦,探针 0b 负对照)
        packagingOptions { jniLibs { useLegacyPackaging = true } }
        // the base is already xz: stored, not deflated again (and readable as a plain stream)
        androidResources { noCompress += ['xz'] }
    }
    signingConfigs {
        // 正式签名走环境变量(CI 由 secrets 注入,见 build-desktop.yml);变量缺席时该配置为空、
        // release 不挂签名(CI 那时改出 debug 包),本地 Android Studio 流程不受影响。
        release {
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            // 并装预览(debug 签名,不碰正式 keystore):
            //   -PnativePreview        = **真 App**,包名 com.forsion.tangu.nativepreview,与已装正式版及其数据并存;
            //   -PnativePreviewSample  = 同一包名,启动直接进审阅用样本页(native-preview.html,
            //                            dist 须以 FORSION_NATIVE_PREVIEW=1 构建)。命令见 mobile/README.md。
            def previewId = project.hasProperty('nativePreview') || project.hasProperty('nativePreviewSample')
            if (previewId) {
                applicationIdSuffix '.nativepreview'
                resValue 'string', 'app_name', 'Forsion Preview'
                resValue 'string', 'title_activity_main', 'Forsion Preview'
            }
            buildConfigField 'boolean', 'NATIVE_PREVIEW_SAMPLE', project.hasProperty('nativePreviewSample') ? 'true' : 'false'
            //   -PnativePreviewFast    = 同上的并装预览,但不带「可调试」标记(签名仍是 debug 的):可调试的包里 ART 不做优化,
            //                            原生那几块(半屏、Dock、胶囊)比正式包慢,拿它感受「手感」会冤枉原生层。给人上手试的包用这个。
            //                            WebView 的远程调试照旧开着(AppActivity 认 WEBVIEW_INSPECTABLE):台架要连页面,
            //                            以前的预览包(可调试)也一直能连。这个开关只在 debug 这一档里,进不了正式包。
            if (project.hasProperty('nativePreviewFast')) debuggable false
            buildConfigField 'boolean', 'WEBVIEW_INSPECTABLE', project.hasProperty('nativePreviewFast') ? 'true' : 'false'
            buildConfigField 'String', 'LOCAL_ENGINE_TEST_KEY', "\"${localEngineTestKey}\""
        }
        release {
            buildConfigField 'boolean', 'NATIVE_PREVIEW_SAMPLE', 'false'
            buildConfigField 'boolean', 'WEBVIEW_INSPECTABLE', 'false'
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    // Pinned to the existing API 35 / AGP 8.7 toolchain. Upgrade the toolchain separately.
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // AppActivity 用 WebViewCompat 给页面注入「这是还原」标记(capacitor-android 自己也依赖它,版本同 variables.gradle)。
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    // 本机引擎的环境包是 tar.xz(LocalEngine TarExtractor)。公有领域许可。
    implementation 'org.tukaani:xz:1.10'
    testImplementation "junit:junit:$junitVersion"
    // P1-K8 原生身份 / 中继的纯逻辑单测(RelayPathsTest 等):android.jar 里的 org.json 是桩(一调就抛 / 返回缺省值),
    // JVM 上要真实现。只进测试 classpath,不进 APK。⚠️ origin/feat/phone-control-t2 同一行,后合者删重复。
    testImplementation 'org.json:json:20231013'
    // 原生栏(顶部胶囊 / 底部 Dock)的尺寸、读屏标签、滚动:不用模拟器,几秒一遍。只进测试 classpath,不进 APK
    // (所以不加 ui-test-manifest —— 它会往 debug 包的清单里塞一个 Activity;测试里自己向 Robolectric 登记)。
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation platform('androidx.compose:compose-bom:2024.12.01')
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Source-test renderer bundles are explicitly marked by Vite; never allow them into a release APK/AAB.
tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    doFirst {
        if (file('src/main/assets/public/forsion-extend-test-only.json').exists()) {
            throw new GradleException('Extend source-test bundle cannot ship in a release. Rebuild with the signed package pin.')
        }
    }
}

// 「这台手机」的基座:测试渠道包把 lock.json 钉住的那份放进资产(sha256 对不上就失败);打完包再核一遍 APK 里的样子 ——
// 测试渠道:assets/local-engine/base.tar.xz 在、STORED、大小等于 lock;普通包:assets/local-engine/ 下什么都没有。
def sha256Of = { File f ->
    def md = java.security.MessageDigest.getInstance('SHA-256')
    f.withInputStream { ins -> byte[] b = new byte[1 << 16]; int n; while ((n = ins.read(b)) > 0) md.update(b, 0, n) }
    md.digest().encodeHex().toString()
}
def stageLocalEngineBase = tasks.register('stageLocalEngineBase') {
    onlyIf { localEngine }
    // the lock and the chosen source are inputs: a different pin or file re-runs it; the staged copy is re-checked by hash
    inputs.file(file('../local-engine/lock.json'))
    inputs.property('baseSource', localEngine ? localEngineBaseSrc().absolutePath : '')
    outputs.dir(localEngineBaseDir)
    outputs.upToDateWhen { false }
    doLast {
        def src = localEngineBaseSrc()
        if (!src.isFile()) throw new GradleException("-PlocalEngine needs the pinned base ${localEngineLock.base.file} (sha256 ${localEngineLock.base.sha256}): pass -PlocalEngineBase=<path> or put it at ${src}. See mobile/android/local-engine/README.md.")
        def got = sha256Of(src)
        if (got != localEngineLock.base.sha256) throw new GradleException("${src} has sha256 ${got}; local-engine/lock.json pins ${localEngineLock.base.sha256}")
        if (src.length() != (localEngineLock.base.size as long)) throw new GradleException("${src} is ${src.length()} bytes; lock.json says ${localEngineLock.base.size}")
        def dst = new File(localEngineBaseDir.get().asFile, 'local-engine/base.tar.xz')
        dst.parentFile.mkdirs()
        if (!dst.isFile() || sha256Of(dst) != localEngineLock.base.sha256) java.nio.file.Files.copy(src.toPath(), dst.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        if (sha256Of(dst) != localEngineLock.base.sha256) throw new GradleException("staged base ${dst} does not match lock.json")
    }
}
tasks.matching { it.name ==~ /merge\w*Assets/ }.configureEach { dependsOn stageLocalEngineBase }
tasks.matching { it.name ==~ /package(Debug|Release)/ }.configureEach { t ->
    doLast {
        def apks = t.outputs.files.asFileTree.matching { include '**/*.apk' }.files
        apks.each { apk ->
            def zip = new java.util.zip.ZipFile(apk)
            try {
                def entries = zip.entries().toList().findAll { it.name.startsWith('assets/local-engine/') }
                if (localEngine) {
                    def e = zip.getEntry('assets/local-engine/base.tar.xz')
                    if (e == null) throw new GradleException("${apk.name}: the test-channel APK has no base asset")
                    if (e.method != java.util.zip.ZipEntry.STORED) throw new GradleException("${apk.name}: the base asset is compressed (must be stored)")
                    if (e.size != (localEngineLock.base.size as long)) throw new GradleException("${apk.name}: base asset is ${e.size} bytes, lock.json says ${localEngineLock.base.size}")
                    def md = java.security.MessageDigest.getInstance('SHA-256')
                    zip.getInputStream(e).withStream { ins -> byte[] b = new byte[1 << 16]; int n; while ((n = ins.read(b)) > 0) md.update(b, 0, n) }
                    if (md.digest().encodeHex().toString() != localEngineLock.base.sha256) throw new GradleException("${apk.name}: the base asset does not match lock.json")
                } else if (!entries.isEmpty()) {
                    throw new GradleException("${apk.name}: a normal-channel APK carries local-engine assets: ${entries*.name}")
                }
            } finally {
                zip.close()
            }
        }
    }
}
