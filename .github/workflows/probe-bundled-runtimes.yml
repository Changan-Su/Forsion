# Existing disposable Windows probe; never run its System32 DLL manipulation on a developer host.
name: probe-bundled-runtimes
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful build-desktop run that produced the candidate
        type: string
        required: true
      expected_commit:
        description: Exact 40-character source commit of that build
        type: string
        required: true
      distribution:
        description: Installer distribution to probe
        type: choice
        default: default
        options: [default, no-extend]
permissions:
  contents: read
  actions: read
jobs:
  clean-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.expected_commit }}
      - name: Verify exact build provenance before downloading
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > "$RUNNER_TEMP/candidate-run.json"
          node -e 'const fs=require("node:fs"); const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/candidate-run.json","utf8")); if(r.head_sha!==process.env.EXPECTED_COMMIT || r.path!==".github/workflows/build-desktop.yml" || r.status!=="completed" || r.conclusion!=="success") throw Error("Candidate run does not match the requested successful build and source commit"); console.log(JSON.stringify({run:r.id,commit:r.head_sha,workflow:r.path}));'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: forsion-windows-2022-${{ inputs.distribution }}
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: art
      - name: Probe bundled runtimes without VC++ runtime
        shell: pwsh
        run: node desktop/scripts/bundled-runtimes.windows-probe.cjs art
