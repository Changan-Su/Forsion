# 构建 Forsion Web(tangu-web)镜像 → 推 ghcr.io,部署服务器免构建直接 pull。
# 动机:web 镜像里的 vite 打包吃内存,小内存 ECS 现场 --build 会 swap 卡死(2026-07-16 实测 25min+ 不出)。
# 触发:推 main 命中 web 真正的源码集就自动出镜像。⚠️ 那个源码集不只 web/** —— web 经
# vite alias 整份复用 desktop 渲染层 / shared amadeus / lcl / mobile 壳(见 web/vite.config.ts),
# 原来只监听 web/**,于是「改了渲染层 → 忘了手动 Run workflow → 修复静默不上线」。
# 2026-08-19 实翻:工作区文件面板的 appId 修复推了 main 却没出镜像,线上跑的还是旧包。
name: build-web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'desktop/frontend/src/**'   # web 的主体渲染层(@/@amadeus 别名)
      - 'desktop/frontend/index.html' # 开屏预览复用的模板
      - 'desktop/frontend/startupAppearance.js'
      - 'desktop/frontend/startupAppearancePlugin.ts'
      - 'desktop/shared/**'         # @amadeus-shared + 渲染层直接 import 的 shared 模块(products / remoteSessions…)
      - 'desktop/products/**'       # shared/product.ts 静态 import ../products/forsion.json
      - 'desktop/CHANGELOG.md'      # changelog.ts 经 ?raw 内联(关于页版本号 / 更新日志)
      - 'desktop/CHANGELOG.en.md'
      - 'desktop/build/copy-excalidraw-assets.cjs' # web 的 prepare-board 调它
      - 'desktop/build/gen-fonts.cjs'              # web 的 prepare-fonts 调它
      - 'unit/releasePolicy.mjs'    # web/vite.config.ts 顶层 import
      - 'tangu-agent/src/core/sessionEmoji.ts' # desktop 渲染层直接 import
      - 'tangu-agent/src/shared/intelligentUi.ts'    # 同上(Intelligent UI 文档格式)
      - 'tangu-agent/src/shared/intelligentCards.ts' # 同上(应用卡片 id 校验)
      - 'lcl/**'                    # @lcl(Space-View 框架)
      - 'mobile/src/**'             # @mobile(手机端壳,web 按 UA 装载)
      - '.github/workflows/build-web.yml'
      # ⚠️ 以上须与 web/Dockerfile 的 COPY 源保持一致,新增 COPY 记得补这里。

permissions:
  contents: read
  packages: write

jobs:
  # 部署前类型闸(2026-08-06 评审 Q4):vite build 用 esbuild 剥类型、完全不做类型检查,
  # sharePage/invitePage 等 web 根文件此前在任何地方都不被 tsc 覆盖(build-desktop 的闸只经
  # @webamadeus 盖到 web/src/amadeus),生产页面「带病出厂」全靠用户发现。红了不出镜像。
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # web 经 vite/tsconfig paths 复用 desktop 渲染层与 lcl,aliased 源码的三方类型
      # 从 desktop/node_modules 解析 → 必须先装 desktop 依赖(同 build-desktop 的 android 模式)。
      # 已知局限(Codex 评审 2026-08-06):typecheck 的依赖解析面(desktop lock)与 Docker 镜像
      # 运行时(web lock)并非同一份,共享库版本漂移时可能对未发布 API 给绿灯 —— 与 build-desktop
      # 的 mobile typecheck 同一性质;根治=两端锁版本对齐,记录在评审报告 P2。
      - name: Install desktop deps (aliased renderer)
        working-directory: desktop
        run: npm install --no-audit --no-fund
      # web 手机视口装载 @mobile 壳(mobile/src/**),tsc 从 mobile/src 向上找 node_modules —— 走的是
      # mobile 自己那份,不是 web/desktop 的。不装它:framer-motion/zustand/react 全报 TS2307。
      # (镜像里无此问题:依赖装在公共祖先 /app,mobile/src 向上就能命中。)
      - name: Install mobile deps (@mobile shell)
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Typecheck web
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run typecheck

  build:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (ghcr 要求全小写)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/forsion-web" >> "$GITHUB_OUTPUT"
      # 仪器:Dockerfile 里每个 FROM 都得走 BASE_REGISTRY(见下面 build-args 的注释)。漏写一个不会立刻红 ——
      # 只在 Docker Hub 限流的那几个小时红,所以在这里直接拦。以后有 FROM <前面的阶段名> 时在这里加例外。
      - name: Base images go through BASE_REGISTRY
        run: |
          if grep -nE '^FROM ' web/Dockerfile | grep -vF '${BASE_REGISTRY}/'; then
            echo '::error file=web/Dockerfile::上面这些 FROM 没走 ${BASE_REGISTRY},会回到 Docker Hub(公共 runner 上会被限流)'
            exit 1
          fi
      # context 必须是仓根:web 复用 desktop/frontend + desktop/shared + lcl 源码(同 web/README 的坑 1)。
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          platforms: linux/amd64 # ponytail: 服务器是 x86;要 arm 部署再加 linux/arm64(QEMU 构建时间翻倍)
          # 基础镜像不从 Docker Hub 拉:公共 runner 匿名要清单会被限流(429 Too Many Requests),与代码无关却让镜像出不来
          # (2026-10-09 实翻,重跑五次都红)。ECR Public 上是 Docker 官方镜像的同一份。⚠️ Dockerfile 里新增 FROM 时
          # 必须写成 ${BASE_REGISTRY}/<名字>,否则那一张又回到 Docker Hub。
          build-args: |
            BASE_REGISTRY=public.ecr.aws/docker/library
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
