name: parity

# 三端功能同步闸的**日常**防线。
#
# build-desktop.yml 里也有同一条检查，但那个 workflow 只在打 v* tag / 手动触发时跑 —— 那是发布门禁，
# 拦得住「发出一个移动端悄悄少功能的版本」，拦不住「这个漏洞在 main 上躺了两周」。
# 本 workflow 补的是后者：改到相关文件就跑，红了当场知道。
#
# 纯 fs 读文件，不装任何依赖，跑完通常几秒。

on:
  pull_request:
    # 放宽到目录级:门控会陆续搬进新文件(GATE_FILES / E 段 store),逐个列文件必然漂移;脚本几秒跑完,放宽成本可忽略。
    paths: &parity_paths
      - 'desktop/frontend/src/**'
      - 'lcl/**'                    # check:tanguboundary 扫整个 lcl(parity 只看 lcl/engine)
      - 'mobile/src/**'
      - 'web/src/**'                # 以下三行同为 check:tanguboundary 的扫描范围
      - 'desktop/shared/**'
      - 'desktop/electron/**'
      - 'tangu-agent/src/contracts/**' # 契约目录(第 2b 步起):check:tanguboundary 管它只许引自己
      - 'mobile/vite.config.ts'   # F 段读它的 engineSwap 替身表
      - 'desktop/scripts/platform-parity.check.cjs'
      - 'desktop/scripts/tangu-boundary.*'
      - '.github/workflows/parity.yml'
  push:
    branches: [main]
    paths: *parity_paths

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Platform parity (desktop ↔ mobile)
        working-directory: desktop
        run: node scripts/platform-parity.check.cjs
      # Tangu 核心插件化第 1 步:宿主只经 @tangu/ui 出口用 Tangu 界面,Tangu 的宿主依赖只许减。纯 fs,几秒。
      - name: Tangu UI boundary
        working-directory: desktop
        run: node scripts/tangu-boundary.check.cjs --selftest && node scripts/tangu-boundary.check.cjs
