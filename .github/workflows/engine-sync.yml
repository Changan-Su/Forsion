# 引擎云同步 / human/ 的落盘路径:10-23 一条提交把 humanFolderSync 带红进了 main(两台断网改画像丢行),没有任何 workflow 跑这些测试
name: engine-sync
on:
  push:
    branches: [main]
    paths: &paths
      - 'tangu-agent/src/services/agentFileSync*'
      - 'tangu-agent/src/services/agentSyncPaths*'
      - 'tangu-agent/src/services/cloudSyncAccount*'
      - 'tangu-agent/src/services/memorySync*'
      - 'tangu-agent/src/services/memoryRepository*'
      - 'tangu-agent/src/services/dbRowMerge*'
      - 'tangu-agent/src/services/agentSchedule*'
      - 'tangu-agent/src/agents/human*'
      - 'tangu-agent/src/agents/cloudAgentStore*'
      - 'tangu-agent/src/seams/cloudBrain*'
      - 'tangu-agent/test/human*'
      - 'tangu-agent/test/agentFileSync*'
      - 'tangu-agent/test/cloudAgentStore*'
      - '.github/workflows/engine-sync.yml'
  pull_request:
    paths: *paths
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tangu-agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tangu-agent/package-lock.json
      - run: npm ci --no-audit --no-fund # 不能 --ignore-scripts:human / cloudAgentStore 的测试要原生 sqlite 绑定
      - run: npx vitest run src/agents/cloudAgentStore.read.test.ts src/services/agentFileSync.safety.test.ts src/services/agentFileSync.test.ts src/services/memorySyncService.test.ts test/agentFileSync.test.ts test/agentLoopRuntimeSafety.test.ts test/agentsPatchRaceCloud.test.ts test/cloudAgentStore.locking.test.ts test/cloudAgentStore.test.ts test/harnessEquip.test.ts test/historianCloudMemory.test.ts test/humanCollaboration.test.ts test/humanFolder.test.ts test/humanFolderSync.test.ts test/loadoutReview.test.ts test/manageHarnessOpen.test.ts test/memoryManagementRoutes.test.ts
