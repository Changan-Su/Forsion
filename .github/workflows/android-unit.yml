name: android-unit

# Kotlin 侧的 JVM 单测(原生栏的状态与布局、中继路径、插件下载…)。不起模拟器、不出包。
# 此前它们只在发版流水线里跑(build-desktop 的 build-android,推 tag 才触发):平时改坏了要到发版那一刻才知道,
# 而且红了会卡住出包。这里在动到 mobile/android 的推送上就跑。

on:
  workflow_dispatch:
  pull_request:
    paths: &android_paths
      - 'mobile/android/**'
      - 'mobile/package.json'
      - 'mobile/package-lock.json'
      - '.github/workflows/android-unit.yml'
  push:
    paths: *android_paths

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Gradle 工程引用 node_modules 里各 Capacitor 插件的 android 模块,以及 cap 生成的 capacitor-cordova-android-plugins
      # (不入库)。`cap update` 只生成这些,不拷网页产物,所以这里不用先 build;它要往 assets/ 里写插件清单,
      # 而这个目录平时是拷网页产物那一步建的(同样不入库),所以先建出来。
      - name: Capacitor's Gradle modules
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          mkdir -p android/app/src/main/assets
          npx cap update android

      - name: Android JVM unit tests
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon
