# 构建 Forsion Web(tangu-web)镜像 → 推 ghcr.io,部署服务器免构建直接 pull。
# 动机:web 镜像里的 vite 打包吃内存,小内存 ECS 现场 --build 会 swap 卡死(2026-07-16 实测 25min+ 不出)。
# 触发:web/** 推 main 自动出镜像;desktop 渲染层/lcl 改了想吃到新代码 → Actions 页手动 Run workflow。
name: build-web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/build-web.yml'

permissions:
  contents: read
  packages: write

jobs:
  # 部署前类型闸(2026-08-06 评审 Q4):vite build 用 esbuild 剥类型、完全不做类型检查,
  # sharePage/invitePage 等 web 根文件此前在任何地方都不被 tsc 覆盖(build-desktop 的闸只经
  # @webamadeus 盖到 web/src/amadeus),生产页面「带病出厂」全靠用户发现。红了不出镜像。
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # web 经 vite/tsconfig paths 复用 desktop 渲染层与 lcl,aliased 源码的三方类型
      # 从 desktop/node_modules 解析 → 必须先装 desktop 依赖(同 build-desktop 的 android 模式)。
      # 已知局限(Codex 评审 2026-08-06):typecheck 的依赖解析面(desktop lock)与 Docker 镜像
      # 运行时(web lock)并非同一份,共享库版本漂移时可能对未发布 API 给绿灯 —— 与 build-desktop
      # 的 mobile typecheck 同一性质;根治=两端锁版本对齐,记录在评审报告 P2。
      - name: Install desktop deps (aliased renderer)
        working-directory: desktop
        run: npm install --no-audit --no-fund
      # web 手机视口装载 @mobile 壳(mobile/src/**),tsc 从 mobile/src 向上找 node_modules —— 走的是
      # mobile 自己那份,不是 web/desktop 的。不装它:framer-motion/zustand/react 全报 TS2307。
      # (镜像里无此问题:依赖装在公共祖先 /app,mobile/src 向上就能命中。)
      - name: Install mobile deps (@mobile shell)
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Typecheck web
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run typecheck

  build:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (ghcr 要求全小写)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/forsion-web" >> "$GITHUB_OUTPUT"
      # context 必须是仓根:web 复用 desktop/frontend + desktop/shared + lcl 源码(同 web/README 的坑 1)。
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          platforms: linux/amd64 # ponytail: 服务器是 x86;要 arm 部署再加 linux/arm64(QEMU 构建时间翻倍)
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
