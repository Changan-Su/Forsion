name: probe-computer-history-windows

on:
  workflow_dispatch:
    inputs:
      stale:
        required: false
        default: ""
  pull_request:
    paths:
      - '.github/workflows/probe-computer-history-windows.yml'
      - 'desktop/electron/computerHistory*'
      - 'desktop/electron/appDock*'
      - 'desktop/electron/builtinBundles.json'
      - 'desktop/package*.json'
      - 'desktop/scripts/computer-history*'
      - 'desktop/scripts/e2e-editor.cjs'
      - 'desktop/scripts/lib/find-chromium.cjs'
      - 'desktop/frontend/src/components/ComputerHistory*'
permissions:
  contents: read
jobs:
  computer-history:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: PROBE chwin cleanup
        working-directory: desktop
        run: |
          New-Item -ItemType Directory -Force outputs/computer-history-windows | Out-Null
          $env:CHWIN_PROBE = "$PWD\outputs\computer-history-windows\chwin-probe.log"
          if ("${{ inputs.stale }}") { $env:CHWIN_STALE = "${{ inputs.stale }}" }
          node node_modules/vitest/vitest.mjs run electron/computerHistoryWin.test.ts
          $code = $LASTEXITCODE
          Select-String -Path $env:CHWIN_PROBE -Pattern '^(SUMMARY|SURVIVED|skip|rm-err)' | Select-Object -First 80 | ForEach-Object { $_.Line }
          Select-String -Path $env:CHWIN_PROBE -Pattern 'existsAfter=true' | Select-Object -First 20 | ForEach-Object { $_.Line }
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-computer-history
          path: desktop/outputs/computer-history-windows/
