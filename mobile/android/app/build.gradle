apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace "com.forsion.tangu"
    compileSdk rootProject.ext.compileSdkVersion
    buildFeatures { compose true; buildConfig true }
    kotlinOptions { jvmTarget = '21' }
    defaultConfig {
        applicationId "com.forsion.tangu"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI(build-desktop.yml)按 run_number/tag 注入,本地缺省 1/"1.0"(同号覆盖安装没问题,只是别发外)。
        versionCode Integer.parseInt(System.getenv("ANDROID_VERSION_CODE") ?: "1")
        versionName (System.getenv("ANDROID_VERSION_NAME") ?: "1.0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // 正式签名走环境变量(CI 由 secrets 注入,见 build-desktop.yml);变量缺席时该配置为空、
        // release 不挂签名(CI 那时改出 debug 包),本地 Android Studio 流程不受影响。
        release {
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            // 并装预览(debug 签名,不碰正式 keystore):
            //   -PnativePreview        = **真 App**,包名 com.forsion.tangu.nativepreview,与已装正式版及其数据并存;
            //   -PnativePreviewSample  = 同一包名,启动直接进审阅用样本页(native-preview.html,
            //                            dist 须以 FORSION_NATIVE_PREVIEW=1 构建)。命令见 mobile/README.md。
            def previewId = project.hasProperty('nativePreview') || project.hasProperty('nativePreviewSample')
            if (previewId) {
                applicationIdSuffix '.nativepreview'
                resValue 'string', 'app_name', 'Forsion Preview'
                resValue 'string', 'title_activity_main', 'Forsion Preview'
            }
            buildConfigField 'boolean', 'NATIVE_PREVIEW_SAMPLE', project.hasProperty('nativePreviewSample') ? 'true' : 'false'
        }
        release {
            buildConfigField 'boolean', 'NATIVE_PREVIEW_SAMPLE', 'false'
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    // Pinned to the existing API 35 / AGP 8.7 toolchain. Upgrade the toolchain separately.
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    // P1-K8 原生身份 / 中继的纯逻辑单测(RelayPathsTest 等):android.jar 里的 org.json 是桩(一调就抛 / 返回缺省值),
    // JVM 上要真实现。只进测试 classpath,不进 APK。⚠️ origin/feat/phone-control-t2 同一行,后合者删重复。
    testImplementation 'org.json:json:20231013'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
