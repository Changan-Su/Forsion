<style>
/* Screening page for the full B film: one 4:3 stage driven by whichever score is playing. */

<main class="page">

<script>
(() => {
  /*%%STAGE_ENGINE%%*/

  const CUES = /*%%CUES%%*/;
  const BEAT = 60 / CUES.bpm, BAR = BEAT * CUES.beatsPerBar, LEN = CUES.length, LEAD = (CUES.lead || 0) * BAR;
  const SEC = {};
  for (const s of CUES.sections) SEC[s.id] = { t: LEAD + s.bar * BAR, end: LEAD + (s.bar + s.bars) * BAR };

  const root = document.querySelector('.stage.fb');
  const box = root.querySelector('.fb-scenes');
  const F = createStage(root, 1440, 1080, LEN);
  grain(F);
  const AV = { aria: '%%ARIA%%', recita: '%%RECITA%%', arioso: '%%ARIOSO%%' };
  const EMBLEM = `%%EMBLEM%%`;

  let sid = 0;
  /* a scene is a full-frame layer shown only inside [a, b) */
  function scene(a, b, cls, html) {
    const id = `s${sid++}`;
    box.insertAdjacentHTML('beforeend', `<div class="scene ${cls}" id="${id}">${html}</div>`);
    F.S(`#${id}`, a, b);
    return `#${id}`;
  }
  /* EVA intertitle: parts are [text, inline style, extra classes] */
  const P = ([t, style, cls = 'fk']) => `<span class="${cls}" style="${style}">${t}</span>`;
  const card = (a, b, parts, cls = 'solid') => scene(a, b, `fb-card ${cls}`, parts.map(P).join(''));
  const cut = (el, t) => F.K(el, [[t - .01, { o: 0 }], [t, { o: 1 }, 'step']]);
  const draw = (sel, t0, t1, opt) => F.K(sel, [[t0, { '--d': 1 }], [t1, { '--d': 0 }, 'out']], opt);

  const opEls = root.querySelectorAll(`${sk} .ops span`);
  F.H(t => { const i = Math.floor((t - MO - 2 * BAR - .2) / .19); opEls.forEach((el, k) => el.classList.toggle('on', k === i)); });
  const SH = MO + 3 * BAR;
  const sy = [230, 460, 690], ky = [200, 340, 480, 620, 760];
  const EDGES = [[0, 0], [0, 1], [0, 3], [1, 1], [1, 2], [1, 4], [2, 0], [2, 2], [2, 3], [2, 4]];

    <span class="lab">SHARED SKILLS<span>Agent × Skills</span></span>
    <svg class="lines" viewBox="0 0 1440 1080" aria-hidden="true">${EDGES.map(([a, s]) => `<path pathLength="1" d="M320 ${sy[a] + 85} C 620 ${sy[a] + 85}, 660 ${ky[s] + 38}, 950 ${ky[s] + 38}"/>`).join('')}</svg>
    ${[AV.arioso, AV.aria, AV.recita].map((img, i) => `<img class="node-a" src="${img}" alt="" style="top:${sy[i]}px">`).join('')}
    ${['web-research', 'document-writing-cn', 'code-review', 'data-analysis-python', 'self-brainstorm'].map((s, i) => `<div class="node-s" style="top:${ky[i]}px">${s}</div>`).join('')}
    <p class="sub" style="top:920px">能力，不再绑定某一个 Agent。</p>`);
  draw(`${shared} .lines path`, SH + .1, SH + .6, { stagger: .07 });
  const AM = MO + 4 * BAR;
  const am = scene(AM, AM + 2 * BAR, 'solid', `
    <span class="lab">TANGU → AMADEUS<span>对话 → 成果</span></span>
    <div class="bubbles"><span class="who">对话 · 会过去</span><div class="bub me">把今天的发布结论整理一下。</div><div class="bub">结论：HUMAN.md 双层协作说明上线；Skills 可共享；新模型接入。已写入笔记。</div></div>
    <svg class="lines" viewBox="0 0 1440 1080" aria-hidden="true"><path pathLength="1" d="M640 480 L740 480 M716 460 L740 480 L716 500"/></svg>
    <div class="sheet note"><div class="path">Amadeus / 发布纪要.md</div><h3>Forsion 2.12 发布纪要</h3><div class="ln" style="width:92%"></div><div class="ln" style="width:76%"></div>
      <p class="todo">发布前真人视觉验收</p><p class="todo">更新 HUMAN.md 示例</p>
      <table><tr><td>模块</td><td>负责人</td><td>状态</td></tr><tr><td>HUMAN.md</td><td>Arioso</td><td>完成</td></tr><tr><td>Skills</td><td>Recita</td><td>验收</td></tr></table></div>
    <p class="sub" style="top:860px">Conversation is temporary. Work should remain.<small>对话会过去，成果应当留下。</small></p>`);
  F.K(`${am} .bubbles`, [[AM + .9, { o: 1 }], [AM + 1.6, { o: .3 }]]);
  draw(`${am} .lines path`, AM + .3, AM + .7);
  F.K(`${am} .note`, [[AM + .5, { o: 0, y: 50, r: 1 }], [AM + 1.0, { o: 1, y: 0 }, 'out']]);
  F.K(`${am} .note > *:not(.path)`, [[AM + 1.0, { o: 0 }], [AM + 1.01, { o: 1 }, 'step']], { stagger: .09 });
  cut(`${am} .sub`, AM + 1.61);
  const MD = MO + 6 * BAR;
  const models = scene(MD, MD + BAR, 'solid', `
    <span class="lab">INTELLIGENCE LAYER<span>模型层</span></span>
    <div class="mods"><p>GPT-6 SOL</p><hr><p>GPT-6 LUNA</p><hr><p>CLAUDE OPUS 5.5</p><div class="ctx">CONTEXT · 更灵活的上下文管理</div></div>
    <p class="sub" style="top:900px">Bring the intelligence you want.</p>`);
  F.K(`${models} .mods p`, [[MD + .05, { o: 0, x: -40 }], [MD + .25, { o: 1, x: 0 }, 'out']], { stagger: .15 });
  const DV = MO + 7 * BAR;
  const dev = scene(DV, SEC.montage.end, 'solid', `
    <span class="lab">REMOTE · MOBILE<span>多设备</span></span>
    <div class="dev pc"><div class="scr"><i style="width:80%"></i><i style="width:60%"></i><i style="width:72%"></i><i style="width:40%"></i></div><p>工作站 · 项目 · 文件 · 工具</p></div>
    <svg class="lines" viewBox="0 0 1440 1080" aria-hidden="true"><line pathLength="1" x1="820" y1="455" x2="1050" y2="455" style="stroke-dasharray:.04 .03;stroke-dashoffset:calc(var(--p, 0) * -1)"/></svg>
    <div class="dev ph"><div class="scr"><i style="width:90%"></i><i style="width:70%"></i></div><p>手机</p></div>
    <p class="sub" style="top:860px">协作，不被一台设备限制。</p>`);
  F.K(`${dev} .lines line`, [[DV, { '--p': 0 }], [SEC.montage.end, { '--p': 3 }, 'lin']]);
  [MO, MO + 2 * BAR, SH, AM, MD, DV].forEach(t => flash(t, .35));

  // ───────── finale ─────────
  const FI = SEC.finale.t;
  card(FI, FI + BAR, [['For years, we have been building better Agents.', 'top:430px;font-size:48px;font-family:var(--f-display)', 'fe mid'], ['多年来，我们一直在建造更好的 Agent。', 'top:520px;font-size:42px;color:#9a9a9a', 'fe mid']]);
  card(FI + BAR, FI + 2 * BAR, [['Forsion 2.12 begins working on the other half.', 'top:430px;font-size:48px', 'fe mid'], ['Forsion 2.12，开始补完另一半。', 'top:520px;font-size:42px;color:#9a9a9a', 'fe mid']]);
  card(FI + 2 * BAR, FI + 3 * BAR, [['人类', 'left:112px;top:120px;font-size:90px'], ['HUMAN.', 'top:360px;font:900 250px/1 var(--f-display);letter-spacing:.02em', 'fe mid red']]);
  flash(FI + 2 * BAR, .9);
  card(FI + 3 * BAR, FI + 4 * BAR, [['不是让人类', 'left:110px;top:230px;font-size:220px'], ['适应 AI。', 'left:110px;top:520px;font-size:260px']]);
  card(FI + 4 * BAR, FI + 5 * BAR, [['而是让人与 AI，', 'left:110px;top:230px;font-size:190px'], ['学会彼此适应。', 'left:110px;top:500px;font-size:240px']]);
  card(FI + 5 * BAR, SEC.finale.end, TITLE_PARTS);
  flash(FI + 5 * BAR, .9);

  // ───────── release: the special edition logo, the tree in red, drawn then filled ─────────
  const RL = SEC.release.t;
  const rel = scene(RL, SEC.release.end, 'solid', `<svg class="emblem" viewBox="190 110 630 745" aria-hidden="true">${EMBLEM}</svg>
    <div class="relt"><span class="nm">FORSION 2.12</span><span class="zh">现已发布</span><span class="url">forsion.net</span></div>`);
  draw(`${rel} .fs-line`, RL + .1, RL + 1.3);
  F.K(`${rel} .fs-fill`, [[RL + BAR - .01, { o: 0 }], [RL + BAR, { o: 1 }, 'step']]);
  F.K(`${rel} .relt`, [[RL + 1.9, { o: 0, y: 12 }], [RL + 2.3, { o: 1, y: 0 }, 'out']]);
  flash(RL + BAR, .45);

  // ───────── credit ─────────
  const CR = SEC.credit.t;
  const cred = scene(CR, LEN, 'solid', `<div class="credit"><span class="by">MADE BY</span><span class="st">FORSION VIDEO STUDIO</span><hr></div>`);
  F.K(`${cred} .credit`, [[CR, { o: 0 }], [CR + .4, { o: 1 }], [LEN - 1.2, { o: 1 }], [LEN - .2, { o: 0 }]]);

  // ───────── hex backdrop only for the pre-title system check, flashes, projector weave ─────────
  const hex = root.querySelector('.fb-hexbg'), hg = hex.getContext('2d'), hr = rng(12), R = 36;
  for (let row = 0, y = 0; y < 1120; row++, y += R * 1.5) for (let x = (row % 2) * R * .866; x < 1480; x += R * 1.732) {
    hg.beginPath(); for (let i = 0; i < 6; i++) { const a = Math.PI / 3 * i + Math.PI / 6; hg.lineTo(x + R * .94 * Math.cos(a), y + R * .94 * Math.sin(a)); } hg.closePath();
    if (hr() > .965) { hg.fillStyle = 'rgba(227,22,27,.3)'; hg.fill(); }
    hg.strokeStyle = 'rgba(255,106,19,.14)'; hg.lineWidth = 1.5; hg.stroke();
  }
  F.H(t => { hex.style.display = t >= SEC.half.t && t < SEC.half.end ? '' : 'none'; });
  flashes.sort((a, b) => a[0] - b[0]);
  const fl = root.querySelector('.sb-flash');
  F.H(t => { let o = 0; for (const [ft, fo] of flashes) if (t >= ft && t < ft + .18) o = Math.max(o, fo * (1 - (t - ft) / .18) ** 2); fl.style.opacity = o; });
  const cards = F.q('.fb-card'), huds = F.q('.hud'), wr = rng(3), weave = [...Array(240)].map(() => [wr() * 2.4 - 1.2, wr() * 2.4 - 1.2, wr()]);
  F.H(t => { const [jx, jy, f] = weave[Math.floor(t * 24) % 240]; for (const c of cards) c.style.translate = `${jx}px ${jy}px`; for (const h of huds) h.style.filter = `brightness(${.94 + f * .12})`; });

  // ───────── capture or player ─────────
  const capture = new URLSearchParams(location.search).get('capture');
  if (capture) {
    document.head.append(...document.querySelectorAll('body style, body link'));
    document.body.replaceChildren(root);
    document.body.style.margin = '0';
    root.style.transform = 'none';
    window.__stage = { w: 1440, h: 1080, dur: LEN, seek: t => F.render(t) };
    F.render(0);
    return;
  }
  const frame = root.parentElement;
  const fit = () => { root.style.transform = `scale(${frame.clientWidth / 1440})`; };
  new ResizeObserver(fit).observe(frame); fit();
  F.render(SEC.title.t + BAR);
  const audios = { battle: document.getElementById('score-battle'), choral: document.getElementById('score-choral') };
  const playBtn = document.getElementById('film-play'), seek = document.getElementById('film-seek'), out = document.getElementById('film-time');
  const scoreBtns = [...document.querySelectorAll('[data-score]')];
  let score = 'battle', started = false;
  const cur = () => audios[score];
  const NAMES = { warning: '警告', boot: '启动', cards: '标题卡', years: '多年来', half: '一半', question: '人类？', title: '片名', twosides: '两面', humanmd: 'HUMAN.md', asks: '问题', agents: 'AGENTS.md', magi: 'MAGI', layers: '双层', evolve: '进化', interface: 'Interface', montage: '系统', finale: '补完', release: '发布', credit: '出品' };
  const chapters = document.querySelector('.chapters');
  chapters.innerHTML = CUES.sections.map(s => `<li><button type="button" data-t="${SEC[s.id].t}"><b>${SEC[s.id].t.toFixed(1)}</b>${NAMES[s.id]}</button></li>`).join('');
  const chapterBtns = [...chapters.querySelectorAll('button')];
  const go = t => { const a = cur(); a.currentTime = Math.max(0, Math.min(LEN, t)); started = true; F.render(a.currentTime); };
  playBtn.addEventListener('click', () => { const a = cur(); if (a.paused) { if (a.ended) a.currentTime = 0; started = true; a.play().catch(() => { out.textContent = '浏览器拦截了播放，请再点一次'; }); } else a.pause(); });
  frame.addEventListener('click', () => playBtn.click());
  seek.addEventListener('input', () => go(+seek.value));
  chapterBtns.forEach(b => b.addEventListener('click', () => { go(+b.dataset.t); cur().play().catch(() => {}); }));
  scoreBtns.forEach(b => b.addEventListener('click', () => {
    Object.values(audios).forEach(a => a.pause());
    score = b.dataset.score;
    scoreBtns.forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    const a = cur(); a.currentTime = 0; started = true;
    a.play().catch(() => {});
  }));
  const tick = () => {
    const a = cur();
    if (started) {
      const t = Math.min(a.currentTime, LEN);
      F.render(t);
      seek.value = t;
      out.textContent = `${t.toFixed(1)} / ${LEN.toFixed(1)}s`;
      chapterBtns.forEach(b => b.classList.toggle('on', t >= +b.dataset.t && !chapterBtns.some(o => +o.dataset.t > +b.dataset.t && t >= +o.dataset.t)));
    }
    playBtn.textContent = a.paused ? '播放' : '暂停';
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  document.addEventListener('keydown', e => { if (e.code === 'Space' && !e.target.closest('input,button')) { e.preventDefault(); playBtn.click(); } });
})();
</script>
