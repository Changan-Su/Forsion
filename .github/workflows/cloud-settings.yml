name: cloud settings
on:
  push:
    branches: [main]
    paths: &paths
      - 'desktop/frontend/src/components/settingsCloudNavigation*'
      - 'desktop/frontend/src/components/SettingsModal.tsx'
      - 'desktop/frontend/src/components/settingsSearchIndex*'
      - 'desktop/frontend/src/components/settingsTarget*'
      - 'desktop/frontend/src/amadeus/plugins/types.ts'
      - '.github/workflows/cloud-settings.yml'
  pull_request:
    paths: *paths
permissions:
  contents: read
# PR 再推送就取消上一轮;main / tag / 手动运行各按 run_id 自成一组,不排队、不被取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  navigation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node build/link-lcl.cjs
      - run: npx vitest run frontend/src/components/settingsCloudNavigation.test.ts frontend/src/components/settingsTarget.test.ts frontend/src/components/settingsSearchIndex.test.ts frontend/src/i18nCoverage.test.ts
