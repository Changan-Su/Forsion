name: calendar-actions
on:
  pull_request:
    paths: ['desktop/frontend/src/views/CalendarView.tsx', 'desktop/frontend/src/views/calendar/**', 'desktop/frontend/src/amadeus/store/dbAggregateStore*', 'desktop/frontend/src/amadeus/store/humanCalendar*', 'desktop/frontend/src/amadeus/store/calendarMembers.ts', 'desktop/frontend/src/amadeus/plugins/pluginDb*', 'desktop/frontend/src/amadeus/plugins/recordSurface*', 'desktop/frontend/src/harness/calendarActions.tsx', 'desktop/frontend/calendar-actions.html', 'desktop/scripts/calendar-actions.check.cjs', 'mobile/scripts/calendar-phone.check.cjs', 'mobile/scripts/calendar-todo.check.cjs', 'mobile/src/plugins/**', 'desktop/frontend/src/amadeus/plugins/pluginCalendar*', 'desktop/frontend/src/amadeus/plugins/pluginData*', 'desktop/shared/corePlugins*', 'mobile/scripts/phone-stage.cjs', '.github/workflows/calendar-actions.yml']
  push:
    branches: [main]
    paths: ['desktop/frontend/src/views/CalendarView.tsx', 'desktop/frontend/src/views/calendar/**', 'desktop/frontend/src/amadeus/store/dbAggregateStore*', 'desktop/frontend/src/amadeus/store/humanCalendar*', 'desktop/frontend/src/amadeus/store/calendarMembers.ts', 'desktop/frontend/src/amadeus/plugins/pluginDb*', 'desktop/frontend/src/amadeus/plugins/recordSurface*', 'desktop/frontend/src/harness/calendarActions.tsx', 'desktop/frontend/calendar-actions.html', 'desktop/scripts/calendar-actions.check.cjs', 'mobile/scripts/calendar-phone.check.cjs', 'mobile/scripts/calendar-todo.check.cjs', 'mobile/src/plugins/**', 'desktop/frontend/src/amadeus/plugins/pluginCalendar*', 'desktop/frontend/src/amadeus/plugins/pluginData*', 'desktop/shared/corePlugins*', 'mobile/scripts/phone-stage.cjs', '.github/workflows/calendar-actions.yml']
jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Europe/London
      CALENDAR_ACTIONS_OUT: ${{ github.workspace }}/calendar-artifacts/components
      CALENDAR_TODO_PHONE_OUT: ${{ github.workspace }}/calendar-artifacts/core-mobile
      CALENDAR_PHONE_OUT: ${{ github.workspace }}/calendar-artifacts/mobile-shell
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: npm ci --no-audit --no-fund
        working-directory: desktop
      - run: npx vitest run frontend/src/views/calendar frontend/src/amadeus/store/dbAggregateStore.test.ts frontend/src/amadeus/plugins/pluginCalendarEvents.test.ts frontend/src/amadeus/plugins/pluginCalendar.test.ts frontend/src/amadeus/plugins/pluginDb.test.ts frontend/src/amadeus/plugins/recordSurface.test.ts frontend/src/amadeus/store/humanCalendar.test.ts frontend/src/amadeus/store/humanCalendarIo.test.ts frontend/src/amadeus/plugins/pluginData.test.ts frontend/src/amadeus/plugins/nativeFeedback.test.ts frontend/src/amadeus/plugins/viewLocations.test.ts shared/corePlugins.test.ts electron/builtinPlugins.test.ts
        working-directory: desktop
      - run: npx playwright-core install --with-deps chromium
        working-directory: desktop
      - run: node scripts/calendar-actions.check.cjs
        working-directory: desktop
      - run: npm ci --no-audit --no-fund
        working-directory: mobile
      - run: node scripts/calendar-phone.check.cjs
        working-directory: mobile
      - run: node scripts/calendar-todo.check.cjs
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: calendar-actions, path: calendar-artifacts, if-no-files-found: ignore }
