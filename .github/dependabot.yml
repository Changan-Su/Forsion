# 内置捆绑包(desktop/electron/builtinBundles.json)在 npm 发了新版 → 提 PR 升级 desktop 里
# 钉死的精确版本,下一个安装包就自带最新版;已装机器不等这个 PR,自己从 npm 更新(builtinUpdates.ts)。
# desktop 全部依赖每日检查，其余三个依赖根及 GitHub Actions 每周检查。
version: 2
updates:
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: daily
    allow:
      - dependency-name: '*'
      - dependency-name: '@forsion/tangu-computer-use'
      - dependency-name: '@forsion/extend'
      - dependency-name: '@forsion/calendar'
    commit-message:
      prefix: 'chore(desktop)'
  - package-ecosystem: npm
    directories: [/web, /mobile, /tangu-agent]
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '@forsion/tangu-computer-use'
      - dependency-name: '@forsion/extend'
      - dependency-name: '@forsion/calendar'
    groups:
      compatible-updates:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
