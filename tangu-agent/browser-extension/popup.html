<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; --fg: #1f2328; --muted: #6e7781; --bg: #ffffff; --line: #d0d7de; --accent: #d97706; --ok: #1a7f37; --bad: #cf222e; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e6edf3; --muted: #8d96a0; --bg: #161b22; --line: #30363d; --ok: #3fb950; --bad: #f85149; } }
  body { margin: 0; width: 320px; font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--fg); background: var(--bg); }
  main { padding: 14px 16px 16px; display: grid; gap: 10px; }
  h1 { margin: 0; font-size: 14px; font-weight: 600; }
  .status { display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.wait { background: var(--accent); }
  label { font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .row { display: flex; gap: 8px; }
  button { flex: 1; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: inherit; font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .hint { color: var(--muted); font-size: 12px; margin: 0; }
  .err { color: var(--bad); font-size: 12px; margin: 0; min-height: 1em; }
</style>
</head>
<body>
<main>
  <h1 data-i18n="popupTitle"></h1>
  <div class="status"><span class="dot" id="dot"></span><span id="status"></span></div>
  <label for="code" data-i18n="codeLabel"></label>
  <input id="code" autocomplete="off" spellcheck="false">
  <p class="err" id="err"></p>
  <div class="row"><button class="primary" id="save" data-i18n="save"></button><button id="forget" data-i18n="forget"></button></div>
  <p class="hint" data-i18n="codeHelp"></p>
  <p class="hint" data-i18n="groupHint"></p>
</main>
<script src="popup.js"></script>
</body>
</html>
